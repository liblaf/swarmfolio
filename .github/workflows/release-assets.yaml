name: Release / Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  executable:
    name: Linux executable
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOARCH: amd64
      GOOS: linux
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - name: Set up Go
        uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build static executable
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/liblaf/swarmfolio/internal/buildinfo.Version=${TAG}"
          -o dist/swarmfolio
          ./cmd/swarmfolio
      - name: Upload executable
        run: gh release upload "$TAG" dist/swarmfolio --clobber
        env:
          GH_TOKEN: ${{ github.token }}
