version: 2

project_name: swarmfolio

builds:
  - main: ./cmd/swarmfolio
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_arm64
      - linux_amd64_v1
      - windows_amd64_v1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/liblaf/swarmfolio/internal/buildinfo.Version=v{{ .Version }}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  disable: true

changelog:
  disable: true

release:
  mode: keep-existing
